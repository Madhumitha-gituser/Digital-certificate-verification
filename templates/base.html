<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CertVerify{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-navy: #0b192c;
            --brand-navy-light: #1e3e62;
            --brand-blue: #1565c0;
            --brand-blue-accent: #2563eb;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-border: #e2e8f0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: var(--brand-navy) !important;
            padding: 0.85rem 0;
            box-shadow: 0 4px 20px rgba(11, 25, 44, 0.12);
        }
        .navbar-brand {
            font-weight: 800;
            color: #ffffff !important;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
        }
        .navbar-brand i {
            color: #60a5fa;
            font-size: 1.4rem;
        }
        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 0.9rem !important;
            transition: all 0.2s ease;
            border-radius: 6px;
        }
        .nav-link:hover {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.08);
        }
        .nav-link.active {
            color: #ffffff !important;
            background: rgba(96, 165, 250, 0.18);
        }

        /* Modern Card Styling */
        .card {
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            border-radius: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: #ffffff;
        }
        .card-header {
            border-radius: 14px 14px 0 0 !important;
            border-bottom: 1px solid var(--card-border);
        }

        /* Footer */
        footer {
            background: #0b192c;
            color: #94a3b8;
            padding: 1.75rem 0;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.88rem;
        }
        footer strong {
            color: #f1f5f9;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/verify">
            <i class="bi bi-shield-check me-2"></i>CertVerify
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                {% if admin %}
                <li class="nav-item">
                    <a class="nav-link" href="/verify"><i class="bi bi-patch-check me-1"></i>Verify Certificate</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/issue"><i class="bi bi-plus-circle me-1"></i>Issue</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/certificates"><i class="bi bi-list-ul me-1"></i>Certificates</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-sm btn-outline-light px-3" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<!-- Main content -->
<main>
{% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer>
    <div class="container text-center">
        <div class="mb-1">
            <strong>CertVerify</strong> &mdash; Secure Academic Certificate Verification System
        </div>
        <div class="text-secondary small">
            &copy; 2026 CertVerify. All rights reserved.
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
