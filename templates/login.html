<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CertVerify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-navy: #0b192c;
            --brand-navy-light: #1e3e62;
            --brand-blue: #1565c0;
            --brand-blue-accent: #2563eb;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(11, 25, 44, 0.08);
            padding: 2.5rem 2.25rem;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-icon {
            width: 58px;
            height: 58px;
            background: var(--brand-navy);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(11, 25, 44, 0.15);
        }
        .brand-icon i {
            font-size: 1.75rem;
            color: #60a5fa;
        }
        .brand-name {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--brand-navy);
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .brand-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
        }
        .card-heading {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.7rem 0.95rem;
            font-size: 0.95rem;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--brand-navy);
            box-shadow: 0 0 0 3px rgba(11, 25, 44, 0.08);
            background: #ffffff;
            outline: none;
        }
        .btn-login {
            background: var(--brand-navy);
            border: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.75rem;
        }
        .btn-login:hover {
            background: var(--brand-navy-light);
        }
        .btn-login:active {
            transform: scale(0.99);
        }
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div class="brand-name">CertVerify</div>
                <div class="brand-subtitle">Secure Academic Certificate Verification</div>
            </div>

            <div class="card-heading">Welcome to CertVerify</div>

            {% if error %}
            <div class="alert-error">
                <i class="bi bi-exclamation-circle-fill"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Enter your username" required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
            </form>
        </div>
        <div class="footer-note">
            &copy; 2026 CertVerify &mdash; Secure Academic Certificate Verification
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
