{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header text-center" style="background:#0b192c; color:white;">
                    <i class="bi bi-shield-lock" style="font-size:2rem;"></i>
                    <h5 class="mt-2 mb-0">Admin Login</h5>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control"
                                   placeholder="admin" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control"
                                   placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <small class="text-muted">
                            Demo credentials: <code>admin</code> / <code>admin123</code>
                        </small>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="/" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
